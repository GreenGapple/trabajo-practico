<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Personajes · Rick and Morty</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__logo" aria-hidden="true">🛸</div>
    <div>
      <h1 class="encabezado__titulo">Buscador Multiversal</h1>
      <p class="encabezado__subtitulo">Personajes de Rick and Morty</p>
    </div>
  </header>

  <main class="contenido">
    <section class="buscador" aria-labelledby="titulo-buscador">
      <h2 id="titulo-buscador" class="buscador__titulo">Buscar personajes</h2>
      <form id="formulario-busqueda" class="formulario" novalidate>
        <div class="formulario__campo">
          <label for="campo-nombre">Nombre</label>
          <input type="text" id="campo-nombre" name="nombre" placeholder="Ej.: Rick, Morty, Summer" autocomplete="off">
        </div>
        <div class="formulario__campo">
          <label for="campo-estado">Estado</label>
          <select id="campo-estado" name="estado">
            <option value="">Todos</option>
            <option value="alive">Vivo</option>
            <option value="dead">Muerto</option>
            <option value="unknown">Desconocido</option>
          </select>
        </div>
        <button type="submit" id="boton-buscar" class="formulario__boton">Buscar</button>
      </form>
    </section>

    <section class="resultados" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados" class="visualmente-oculto">Resultados</h2>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      <div id="grilla-tarjetas" class="grilla"></div>
    </section>
  </main>

  <footer class="pie">
    <p>Trabajo Práctico · Ricardo Moreira Correa · Datos de <a href="https://rickandmortyapi.com" target="_blank" rel="noopener">The Rick and Morty API</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
